name: Build & Deploy HH Parser Bot

on:
  push:
    branches:
      - main
      - master

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/hhparser:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Server via SSH
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            set -e
            APP_DIR=~/hhparser
            mkdir -p $APP_DIR/data
            cd $APP_DIR

            # Write .env with secrets
            cat << 'EOF' > .env
            BOT_TOKEN=${{ secrets.BOT_TOKEN }}
            CHAT_ID=${{ secrets.CHAT_ID }}
            CHECK_INTERVAL_SECONDS=300
            MIN_SALARY_RUB=50000
            DATABASE_URL=sqlite+aiosqlite:///./data/vacancies.db
            HH_USER_AGENT=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36
            DOCKER_IMAGE=${{ secrets.DOCKER_USERNAME }}/hhparser:latest
            EOF

            # Write docker-compose.yml
            cat << 'EOF' > docker-compose.yml
            services:
              hhparser:
                image: ${{ secrets.DOCKER_USERNAME }}/hhparser:latest
                container_name: hhparser_bot
                restart: unless-stopped
                env_file:
                  - .env
                volumes:
                  - ./data:/app/data
            EOF

            # Pull latest image & restart container
            docker pull ${{ secrets.DOCKER_USERNAME }}/hhparser:latest
            docker compose down || true
            docker compose up -d

            # Clean up old dangling images
            docker image prune -f
