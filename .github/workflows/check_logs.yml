name: Check Server Logs

on:
  workflow_dispatch:

jobs:
  check-logs:
    name: Fetch Logs from VPS
    runs-on: ubuntu-latest
    steps:
      - name: Fetch logs via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            echo "=== DOCKER CONTAINERS ==="
            docker ps
            echo "=== DATABASE STATS ==="
            docker exec hhparser_bot python -c "import sqlite3; conn = sqlite3.connect('data/vacancies.db'); cur = conn.cursor(); cur.execute('SELECT status, count(*) FROM processed_vacancies GROUP BY status'); print('Статусы processed_vacancies:', cur.fetchall()); cur.execute('SELECT count(*) FROM vacancies'); print('Всего одобрено в vacancies:', cur.fetchone()[0]); cur.execute('SELECT id, title, company, match_score, created_at FROM vacancies ORDER BY created_at DESC LIMIT 5'); [print(f'  • {r[0]}: {r[1]} ({r[2]}) — score {r[3]}% [{r[4]}]') for r in cur.fetchall()]" || true
            echo "=== CONTAINER LOGS ==="
            docker logs --tail 150 hhparser_bot
