name: Check Server Logs

on:
  workflow_dispatch:

jobs:
  check-logs:
    name: Fetch Logs from VPS
    runs-on: ubuntu-latest
    steps:
      - name: Fetch logs via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            echo "=== NGINX PORTS & LISTENING SOCKETS ==="
            echo "${{ secrets.SERVER_PASSWORD }}" | sudo -S ss -tulpn 2>/dev/null | grep -E "nginx|:[0-9]+" || ss -tulpn

            echo "=== NGINX SITES DIRECTORY LISTING ==="
            ls -la /etc/nginx/sites-enabled/ 2>/dev/null || true
            ls -la /etc/nginx/conf.d/ 2>/dev/null || true

            echo "=== FULL NGINX CONFIGURATION (nginx -T) ==="
            echo "${{ secrets.SERVER_PASSWORD }}" | sudo -S nginx -T 2>/dev/null || nginx -T 2>/dev/null || cat /etc/nginx/nginx.conf
